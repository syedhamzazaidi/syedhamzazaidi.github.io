<!DOCTYPE html>
<html lang="en" data-theme="arxiv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Syed Hamza Zaidi</title>
<link rel="stylesheet" href="/styles/base.css">
<link rel="stylesheet" href="/styles/themes/arxiv.css">
<style>
  html[data-theme="arxiv"] {
    --font-body: 'IBM Plex Serif', Georgia, serif;
    --font-title: 'IBM Plex Serif', serif;
    --font-meta: 'IBM Plex Mono', monospace;
    --color-bg: #fafafa;
    --color-text: #111;
    --color-muted: #444;
    --color-link: #1a0dab;
  }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .not-found { text-align: center; max-width: 480px; padding: 2rem; }
  .not-found h1 { font-family: var(--font-title); font-size: 1.5rem; margin-bottom: 0.75rem; }
  .not-found p { color: var(--color-muted); margin-bottom: 1.25rem; line-height: 1.6; }
  .not-found a { color: var(--color-link); }
  .not-found .meta { font-family: var(--font-meta); font-size: 0.8rem; color: var(--color-muted); margin-bottom: 1.5rem; }
</style>
</head>
<body>
<div class="not-found">
  <p class="meta">Error 404 · Page not found</p>
  <h1>Manuscript not available</h1>
  <p>The requested resource could not be located in this repository.</p>
  <p><a href="/">Return to main document</a></p>
</div>
</body>
</html>
